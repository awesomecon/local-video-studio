# Optional machine-local overrides. Copy this file to config/local.yaml; that
# destination is ignored by Git. Do not put passwords, tokens, or API keys here.

paths:
  model_root: "/path/to/large-data-volume/models"
  cache_root: "/path/to/large-data-volume/cache"

backends:
  qwen_tts:
    model_path: "/path/to/large-data-volume/models/tts/qwen/Qwen3-TTS-12Hz-1.7B-Base"
  breeze_tts_2:
    python_path: "/path/to/services/breeze-tts/.venv/bin/python"
    model_path: "/path/to/large-data-volume/models/tts/breeze/Breeze-TTS-2"
  higgs_tts_3:
    python_path: "/path/to/services/sglang-omni/.venv/bin/python"
    model_path: "/path/to/large-data-volume/models/tts/higgs/bosonai-higgs-tts-3-4b"
  # Remote Gemini TTS: point at a different model or default voice if you
  # prefer. Do not put the API key here — use the GEMINI_API_KEY environment
  # variable or save a key from the Voice page.
  gemini_tts:
    model: "gemini-3.1-flash-tts-preview"
    voice: "Kore"
