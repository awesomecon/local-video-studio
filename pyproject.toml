[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-studio"
version = "0.1.0"
description = "Local-first, restartable AI video production studio"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pillow>=10",
  "psutil>=5.9",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "websocket-client>=1.8"]

[project.scripts]
local-video-studio = "backend.api.main:run"
lvs-mock-render = "backend.pipeline.cli:main"
lvs-ideogram-prompt = "backend.models.ideogram_prompt_cli:main"

[tool.setuptools.package-data]
"backend.models" = ["prompts/*.txt", "prompts/*.md"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
